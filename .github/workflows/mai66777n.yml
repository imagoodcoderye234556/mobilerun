name: 🚀 RDP FREE - SERVEO TUNNEL (Miễn Phí, Domain Cố Định)
on:
  workflow_dispatch:
    inputs:
      duration:
        description: '🕐 Thời gian sử dụng'
        required: false
        default: '5h40m'
        type: choice
        options:
          - '1h'
          - '3h'
          - '5h40m'

jobs:
  RDP-Free-Serveo:
    runs-on: windows-latest
    timeout-minutes: 340
    steps:
      - name: 🎯 KHỞI ĐỘNG
        run: |
          Write-Host "🤖 RDP FREE - SERVEO TUNNEL (Hoàn Toàn Miễn Phí)" -ForegroundColor Yellow
          Write-Host "⚡ Domain Cố Định, Zero Cost, Unlimited" -ForegroundColor Green
          Write-Host ""

      # KHỞI ĐỘNG RDP
      - name: 🔐 KHỞI ĐỘNG RDP SERVER
        run: |
          Write-Host "🔐 Khởi động RDP..." -ForegroundColor Yellow

          # Bật RDP nếu chưa bật
          $rdpReg = Get-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -ErrorAction SilentlyContinue
          if ($rdpReg.fDenyTSConnections -ne 0) {
            Write-Host "📦 Bật RDP Server..." -ForegroundColor Yellow
            Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0 -Force
          }

          # Khởi động Remote Desktop Services
          Start-Service -Name TermService -ErrorAction SilentlyContinue
          Set-Service -Name TermService -StartupType Automatic

          # Mở Firewall cho RDP
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "RDP Allow" -Direction Inbound -LocalPort 3389 -Protocol TCP -Action Allow -ErrorAction SilentlyContinue

          # Kiểm tra
          Start-Sleep -Seconds 3
          $rdpStatus = (Get-Service -Name TermService).Status
          Write-Host "✅ RDP Status: $rdpStatus" -ForegroundColor Green

      # KHỞI ĐỘNG SERVEO TUNNEL
      - name: 🌐 KHỞI ĐỘNG SERVEO TUNNEL
        run: |
          Write-Host "🌐 Khởi động Serveo Tunnel..." -ForegroundColor Yellow

          # Tạo thư mục cho ssh key nếu cần
          $sshDir = "$env:USERPROFILE\.ssh"
          if (-not (Test-Path $sshDir)) {
            New-Item -Path $sshDir -ItemType Directory -Force | Out-Null
          }

          # Khởi động tunnel - tạo reverse tunnel từ localhost:3389 sang serveo.net
          # Format: ssh -R 3389:localhost:3389 serveo.net
          $logPath = "$env:TEMP\serveo-tunnel.log"
          
          # Start SSH tunnel in background (không cần Hide, để nó chạy)
          $process = Start-Process -FilePath "ssh" -ArgumentList "-R 3389:localhost:3389 serveo.net" -PassThru
          Add-Content $logPath "Tunnel started at $(Get-Date), PID: $($process.Id)"

          # Chờ tunnel thiết lập
          Start-Sleep -Seconds 5

          Write-Host "✅ Serveo Tunnel đang khởi động..." -ForegroundColor Green
          Write-Host "📋 Kiểm tra log: $logPath" -ForegroundColor Yellow

      # HIỂN THỊ THÔNG TIN
      - name: 🎉 THÔNG TIN RDP FREE SERVEO
        run: |
          $durationInput = "${{ github.event.inputs.duration }}"

          switch ($durationInput) {
            "1h" { $totalMinutes = 60; $displayTime = "1 giờ" }
            "3h" { $totalMinutes = 180; $displayTime = "3 giờ" }
            "5h40m" { $totalMinutes = 340; $displayTime = "5 giờ 40 phút" }
          }

          $timeZone = [System.TimeZoneInfo]::FindSystemTimeZoneById("SE Asia Standard Time")
          $endTime = [System.TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), $timeZone).AddMinutes($totalMinutes)

          # Đọc Serveo domain từ log file
          $logFile = "$env:TEMP\serveo-tunnel.log"
          $serveroDomain = "Chờ xác định..."
          if (Test-Path $logFile) {
            $logContent = Get-Content $logFile -Raw
            if ($logContent -match "Forwarding remote port (\d+) to") {
              $serveroDomain = "Được cấp bởi Serveo.net"
            }
          }

          Write-Host ""
          Write-Host "╔═══════════════════════════════════════════════════╗" -ForegroundColor Cyan
          Write-Host "║   🎉 RDP FREE - SERVEO TUNNEL                    ║" -ForegroundColor Cyan
          Write-Host "╠═══════════════════════════════════════════════════╣" -ForegroundColor Cyan
          Write-Host "║                                                   ║" -ForegroundColor Cyan
          Write-Host "║  💰 CHI PHÍ: \$0 / Hoàn toàn miễn phí            ║" -ForegroundColor Green
          Write-Host "║  📊 GIỚI HẠN: KHÔNG GIỚI HẠN (unlimited)         ║" -ForegroundColor Green
          Write-Host "║  ⚡ TỐC ĐỘ: Cực nhanh (Direct tunnel)            ║" -ForegroundColor Green
          Write-Host "║  🔒 BẢO MẬT: SSH encrypted tunnel                ║" -ForegroundColor Green
          Write-Host "║                                                   ║" -ForegroundColor Cyan
          Write-Host "║  🌐 SERVEO TUNNEL (SSH Reverse Tunnel)          ║" -ForegroundColor Cyan
          Write-Host "║  ├─ Phương thức: SSH Reverse Tunnel             ║" -ForegroundColor White
          Write-Host "║  ├─ Service: Serveo.net (Tự động cấp subdomain)║" -ForegroundColor White
          Write-Host "║  ├─ Port: 3389 (RDP)                            ║" -ForegroundColor White
          Write-Host "║  ├─ User: Administrator                         ║" -ForegroundColor White
          Write-Host "║  └─ Kết nối RDP:                                ║" -ForegroundColor White
          Write-Host "║     localhost:3389 (local)                      ║" -ForegroundColor Yellow
          Write-Host "║     hoặc qua Serveo domain (xem tunnel log)    ║" -ForegroundColor Yellow
          Write-Host "║                                                   ║" -ForegroundColor Cyan
          Write-Host "║  🌟 ƯU ĐIỂM:                                     ║" -ForegroundColor Green
          Write-Host "║  ✅ Hoàn toàn miễn phí (không giới hạn)         ║" -ForegroundColor White
          Write-Host "║  ✅ Không cần đăng ký account                   ║" -ForegroundColor White
          Write-Host "║  ✅ Domain cố định (serveo.net)                 ║" -ForegroundColor White
          Write-Host "║  ✅ Bảo mật cao (SSH encrypted)                 ║" -ForegroundColor White
          Write-Host "║  ✅ Không cần mở cổng router                    ║" -ForegroundColor White
          Write-Host "║  ✅ Hỗ trợ RDP, SSH, HTTP, HTTPS                ║" -ForegroundColor White
          Write-Host "║                                                   ║" -ForegroundColor Cyan
          Write-Host "║  ⏱️  Thời gian: $displayTime" -ForegroundColor White
          Write-Host "║  🕐  Kết thúc: $($endTime.ToString('HH:mm:ss')) (VN)            ║" -ForegroundColor White
          Write-Host "║                                                   ║" -ForegroundColor Cyan
          Write-Host "║  💡 Kiểm tra log để lấy Serveo domain:         ║" -ForegroundColor Yellow
          Write-Host "║     $env:TEMP\serveo-tunnel.log" -ForegroundColor Yellow
          Write-Host "╚═══════════════════════════════════════════════════╝" -ForegroundColor Cyan
          Write-Host ""

          echo "TOTAL_MINUTES=$totalMinutes" >> $env:GITHUB_ENV

      # DUY TRÌ KẾT NỐI
      - name: ⏳ DUY TRÌ RDP
        run: |
          $totalMinutes = $env:TOTAL_MINUTES
          $timeZone = [System.TimeZoneInfo]::FindSystemTimeZoneById("SE Asia Standard Time")
          $endTime = [System.TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), $timeZone).AddMinutes($totalMinutes)

          Write-Host "🟢 RDP HOẠT ĐỘNG - Bạn có thể kết nối RDP ngay!" -ForegroundColor Green
          Write-Host ""
          Write-Host "📝 Thông tin kết nối:" -ForegroundColor Yellow
          Write-Host "Host: localhost:3389 (kết nối cục bộ)" -ForegroundColor Cyan
          Write-Host "User: Administrator" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "📋 Kiểm tra log Serveo:" -ForegroundColor Yellow
          Write-Host "File: $env:TEMP\serveo-tunnel.log" -ForegroundColor Cyan
          Write-Host ""

          $frames = @('⠋','⠙','⠹','⠸','⠼','⠴','⠦','⠧','⠇','⠏')
          $startTime = Get-Date

          do {
            $now = [System.TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), $timeZone)
            $remaining = $endTime - $now
            if ($remaining.TotalSeconds -le 0) { break }

            $h = [int][math]::Floor($remaining.TotalHours)
            $m = [int][math]::Floor($remaining.TotalMinutes % 60)
            $s = [int][math]::Floor($remaining.TotalSeconds % 60)
            $f = $frames[([int]((Get-Date)-$startTime).TotalSeconds) % $frames.Length]

            Write-Host "`r$f ⏳ Còn lại: ${h}:$('{0:d2}' -f $m):$('{0:d2}' -f $s) - 🟢 HOẠT ĐỘNG" -NoNewline -ForegroundColor Cyan

            Start-Sleep -Seconds 5
          } while ($true)

          Write-Host ""
          Write-Host "⛔ Hết thời gian" -ForegroundColor Red

      # DỌN DẸP
      - name: 🧹 DỌN DẸP
        if: always()
        run: |
          Write-Host "🧹 Dọn dẹp..." -ForegroundColor Yellow

          Stop-Process -Name "ssh" -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:TEMP\serveo-*" -Force -Recurse -ErrorAction SilentlyContinue

          Write-Host "✅ Hoàn tất" -ForegroundColor Green
