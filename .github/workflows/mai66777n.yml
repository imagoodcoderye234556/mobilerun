name: 🚀 SSH FREE - LOCALTUNNEL (HOÀN TOÀN MIỄN PHÍ)
on:
  workflow_dispatch:
    inputs:
      duration:
        description: '🕐 Thời gian sử dụng'
        required: false
        default: '5h40m'
        type: choice
        options:
          - '1h'
          - '3h'
          - '5h40m'

jobs:
  SSH-Free-LocalTunnel:
    runs-on: windows-latest
    timeout-minutes: 340
    steps:
      - name: 🎯 KHỞI ĐỘNG
        run: |
          Write-Host "🤖 SSH FREE - LOCALTUNNEL (Hoàn Toàn Miễn Phí)" -ForegroundColor Yellow
          Write-Host "⚡ Zero Cost, Zero Limit" -ForegroundColor Green
          Write-Host ""

      # CÀI ĐẶT NODE.JS
      - name: 📦 CÀI ĐẶT NODE.JS
        run: |
          Write-Host "📥 Tải Node.js..." -ForegroundColor Yellow
          
          # Tải Node.js (thường có sẵn trên Windows runner)
          if (-not (Test-Path "C:\Program Files\nodejs\node.exe")) {
            Invoke-WebRequest -Uri "https://nodejs.org/dist/v18.17.0/node-v18.17.0-win-x64.msi" -OutFile "$env:TEMP\node.msi" -UseBasicParsing
            msiexec.exe /i "$env:TEMP\node.msi" /quiet /norestart
            Start-Sleep -Seconds 10
          }
          
          Write-Host "✅ Node.js ready" -ForegroundColor Green
          node --version
          npm --version

      # CÀI ĐẶT LOCALTUNNEL
      - name: 🔌 CÀI ĐẶT LOCALTUNNEL
        run: |
          Write-Host "📥 Cài localtunnel..." -ForegroundColor Yellow
          
          npm install -g localtunnel
          
          Write-Host "✅ localtunnel ready" -ForegroundColor Green
          lt --version

      # KHỞI ĐỘNG SSH
      - name: 🔐 KHỞI ĐỘNG SSH SERVER
        run: |
          Write-Host "🔐 Khởi động SSH..." -ForegroundColor Yellow
          
          # Cài OpenSSH nếu chưa có
          $sshSvc = Get-Service -Name sshd -ErrorAction SilentlyContinue
          if (-not $sshSvc) {
            Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 -ErrorAction SilentlyContinue
          }
          
          # Khởi động
          Start-Service sshd -ErrorAction SilentlyContinue
          Set-Service -Name sshd -StartupType Automatic
          
          # Mở Firewall
          Enable-NetFirewallRule -DisplayGroup "OpenSSH Server" -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "SSH Allow" -Direction Inbound -LocalPort 22 -Protocol TCP -Action Allow -ErrorAction SilentlyContinue
          
          # Kiểm tra
          $sshStatus = (Get-Service -Name sshd).Status
          Write-Host "✅ SSH Status: $sshStatus" -ForegroundColor Green

      # KHỞI ĐỘNG LOCALTUNNEL TUNNEL
      - name: 🚀 LOCALTUNNEL TUNNEL CONNECT
        run: |
          Write-Host "🚀 Khởi động localtunnel tunnel..." -ForegroundColor Yellow
          Write-Host "💡 Lưu ý: Localtunnel domain thay đổi mỗi lần chạy" -ForegroundColor Cyan
          
          # Tạo file script để chạy localtunnel
          $scriptPath = "$env:TEMP\start-tunnel.ps1"
          @"
          `$outputFile = "$env:TEMP\tunnel-url.txt"
          `$process = Start-Process -FilePath "cmd.exe" -ArgumentList "/c lt --port 22 > `"$outputFile`" 2>&1" -PassThru -WindowStyle Hidden
          
          Start-Sleep -Seconds 5
          
          # Lấy URL từ output
          if (Test-Path `$outputFile) {
              `$content = Get-Content `$outputFile -Raw
              Write-Host "Tunnel Output: `$content"
          }
          "@ | Set-Content $scriptPath
          
          # Chạy tunnel (background)
          Start-Process powershell.exe -ArgumentList "-NoProfile -ExecutionPolicy Bypass -File $scriptPath" -WindowStyle Hidden
          
          Start-Sleep -Seconds 8

      # LẤY LOCALTUNNEL URL
      - name: 🆔 LẤY LOCALTUNNEL URL
        run: |
          Write-Host "🔍 Lấy localtunnel URL..." -ForegroundColor Yellow
          
          # Cách 1: Từ environment variable hoặc file log
          $outputFile = "$env:TEMP\tunnel-url.txt"
          $maxRetries = 15
          $retries = 0
          $tunnelUrl = $null
          
          while ([string]::IsNullOrWhiteSpace($tunnelUrl) -and $retries -lt $maxRetries) {
            try {
              if (Test-Path $outputFile) {
                $content = Get-Content $outputFile -Raw
                if ($content -match "your url is:\s*(.*?)(?:\r|\n|$)") {
                  $tunnelUrl = $matches[1].Trim()
                }
                if ($content -match "https://.*?\.loca\.lt") {
                  $tunnelUrl = $matches[0]
                }
              }
              
              if ([string]::IsNullOrWhiteSpace($tunnelUrl)) {
                # Thử cách khác: từ localhost:3000
                Write-Host "⏳ Chờ tunnel khởi động... ($($retries + 1)/$maxRetries)" -ForegroundColor Cyan
                Start-Sleep -Seconds 2
              }
            } catch {
              Start-Sleep -Seconds 2
            }
            $retries++
          }
          
          # Nếu không có, sử dụng lệnh trực tiếp
          if ([string]::IsNullOrWhiteSpace($tunnelUrl)) {
            Write-Host "⏳ Tạo tunnel trực tiếp..." -ForegroundColor Yellow
            $tunnelUrl = "Waiting for tunnel URL..."
          } else {
            Write-Host "✅ Tunnel URL: $tunnelUrl" -ForegroundColor Green
          }
          
          echo "TUNNEL_URL=$tunnelUrl" >> $env:GITHUB_ENV

      # HIỂN THỊ THÔNG TIN
      - name: 🎉 THÔNG TIN SSH FREE
        run: |
          $durationInput = "${{ github.event.inputs.duration }}"
          
          switch ($durationInput) {
            "1h" { $totalMinutes = 60; $displayTime = "1 giờ" }
            "3h" { $totalMinutes = 180; $displayTime = "3 giờ" }
            "5h40m" { $totalMinutes = 340; $displayTime = "5 giờ 40 phút" }
          }
          
          $timeZone = [System.TimeZoneInfo]::FindSystemTimeZoneById("SE Asia Standard Time")
          $endTime = [System.TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), $timeZone).AddMinutes($totalMinutes)
          
          Write-Host ""
          Write-Host "╔════════════════════════════════════════════════╗" -ForegroundColor Cyan
          Write-Host "║   🎉 SSH FREE - LOCALTUNNEL (HOÀN TOÀN VN)   ║" -ForegroundColor Cyan
          Write-Host "╠════════════════════════════════════════════════╣" -ForegroundColor Cyan
          Write-Host "║                                                ║" -ForegroundColor Cyan
          Write-Host "║  💰 CHI PHÍ: $0 / Miễn phí mãi mãi" -ForegroundColor Green
          Write-Host "║  📊 GIỚI HẠN: Không giới hạn" -ForegroundColor Green
          Write-Host "║  ⚡ TỐC ĐỘ: Nhanh (phụ thuộc mạng)" -ForegroundColor Green
          Write-Host "║                                                ║" -ForegroundColor Cyan
          Write-Host "║  🔌 LOCALTUNNEL (Open Source & Free)          ║" -ForegroundColor Cyan
          Write-Host "║  ├─ Phương thức: SSH Tunnel qua HTTPS        ║" -ForegroundColor White
          Write-Host "║  ├─ Domain: Random (thay đổi mỗi lần)        ║" -ForegroundColor White
          Write-Host "║  ├─ User: Administrator                       ║" -ForegroundColor White
          Write-Host "║  └─ SSH Command:" -ForegroundColor White
          Write-Host "║     ssh Administrator@<tunnel-url> -p 22      ║" -ForegroundColor Yellow
          Write-Host "║                                                ║" -ForegroundColor Cyan
          Write-Host "║  ⚠️  LƯU Ý:                                    ║" -ForegroundColor Yellow
          Write-Host "║  • Domain thay đổi mỗi lần chạy workflow      ║" -ForegroundColor Yellow
          Write-Host "║  • Tốc độ phụ thuộc kết nối mạng             ║" -ForegroundColor Yellow
          Write-Host "║  • Bảo mật: Tốt (HTTPS tunnel)               ║" -ForegroundColor Yellow
          Write-Host "║                                                ║" -ForegroundColor Cyan
          Write-Host "║  📖 Cách lấy SSH URL:                         ║" -ForegroundColor Cyan
          Write-Host "║  1. Xem Logs phần này                         ║" -ForegroundColor White
          Write-Host "║  2. Tìm dòng: 'your url is: ...'             ║" -ForegroundColor White
          Write-Host "║  3. SSH vào bằng URL đó                      ║" -ForegroundColor White
          Write-Host "║                                                ║" -ForegroundColor Cyan
          Write-Host "║  ⏱️  Thời gian: $displayTime" -ForegroundColor White
          Write-Host "║  🕐  Kết thúc: $($endTime.ToString('HH:mm:ss')) (VN)          ║" -ForegroundColor White
          Write-Host "║                                                ║" -ForegroundColor Cyan
          Write-Host "╚════════════════════════════════════════════════╝" -ForegroundColor Cyan
          Write-Host ""
          
          echo "TOTAL_MINUTES=$totalMinutes" >> $env:GITHUB_ENV

      # DUY TRÌ KẾT NỐI
      - name: ⏳ DUY TRÌ SSH
        run: |
          $totalMinutes = $env:TOTAL_MINUTES
          $timeZone = [System.TimeZoneInfo]::FindSystemTimeZoneById("SE Asia Standard Time")
          $endTime = [System.TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), $timeZone).AddMinutes($totalMinutes)
          
          Write-Host "🟢 SSH HOẠT ĐỘNG - Bạn có thể SSH vào bây giờ!" -ForegroundColor Green
          Write-Host "💡 Mở terminal khác và SSH vào tunnel URL ở trên" -ForegroundColor Yellow
          Write-Host ""
          
          $frames = @('⠋','⠙','⠹','⠸','⠼','⠴','⠦','⠧','⠇','⠏')
          $startTime = Get-Date
          
          do {
            $now = [System.TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), $timeZone)
            $remaining = $endTime - $now
            if ($remaining.TotalSeconds -le 0) { break }
            
            $h = [math]::Floor($remaining.TotalHours)
            $m = [math]::Floor($remaining.TotalMinutes % 60)
            $s = [math]::Floor($remaining.TotalSeconds % 60)
            $f = $frames[([int]((Get-Date)-$startTime).TotalSeconds) % $frames.Length]
            
            Write-Host "`r$f ⏳ Còn lại: $h:$('{0:d2}' -f $m):$('{0:d2}' -f $s) - 🟢 KẾT NỐI HOẠT ĐỘNG" -NoNewline -ForegroundColor Cyan
            
            Start-Sleep -Seconds 5
          } while ($true)
          
          Write-Host ""
          Write-Host "⛔ Hết thời gian" -ForegroundColor Red

      # DỌN DẸP
      - name: 🧹 DỌN DẸP
        if: always()
        run: |
          Write-Host "🧹 Dọn dẹp..." -ForegroundColor Yellow
          
          Stop-Process -Name "lt", "localtunnel" -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:TEMP\tunnel-url.txt" -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:TEMP\start-tunnel.ps1" -Force -ErrorAction SilentlyContinue
          
          Write-Host "✅ Hoàn tất" -ForegroundColor Green
